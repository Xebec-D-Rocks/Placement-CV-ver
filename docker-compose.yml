services:
  db:
    image: postgres:17
    container_name: ${COMPOSE_PROJECT_NAME:-coalguard}_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-coalguard}
      POSTGRES_USER: ${POSTGRES_USER:-coalguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-coalguard}
    volumes:
      - coalguard_pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT_HOST:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-coalguard} -d ${POSTGRES_DB:-coalguard}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-coalguard}_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT_HOST:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build: .
    container_name: ${COMPOSE_PROJECT_NAME:-coalguard}_web
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py bootstrap_data &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60"
    volumes:
      - .:/app
      - ./data/raw:/app/data/raw
      - coalguard_media:/app/media
    ports:
      - "${WEB_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 60s
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      POSTGRES_DB: ${POSTGRES_DB:-coalguard}
      POSTGRES_USER: ${POSTGRES_USER:-coalguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-coalguard}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-change-me}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build: .
    container_name: ${COMPOSE_PROJECT_NAME:-coalguard}_worker
    restart: unless-stopped
    command: celery -A config worker -l info
    volumes:
      - .:/app
      - ./data/raw:/app/data/raw
      - coalguard_media:/app/media
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      POSTGRES_DB: ${POSTGRES_DB:-coalguard}
      POSTGRES_USER: ${POSTGRES_USER:-coalguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-coalguard}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-change-me}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_beat:
    build: .
    container_name: ${COMPOSE_PROJECT_NAME:-coalguard}_beat
    restart: unless-stopped
    command: celery -A config beat -l info
    volumes:
      - .:/app
      - ./data/raw:/app/data/raw
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      POSTGRES_DB: ${POSTGRES_DB:-coalguard}
      POSTGRES_USER: ${POSTGRES_USER:-coalguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-coalguard}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-change-me}
    depends_on:
      - celery_worker

volumes:
  coalguard_pgdata:
  coalguard_media:
